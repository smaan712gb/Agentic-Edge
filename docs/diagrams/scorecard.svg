<?xml version="1.0" encoding="UTF-8"?>
<!--
  Agentic Edge — How the agents score.

  GitHub-renderable SVG with SMIL animations (no JavaScript, no external CSS).
  Drop into README via:  ![](docs/diagrams/scorecard.svg)

  Visuals:
   - Left panel: per-ticker scorecard (MU as the example) showing the six
     scoring dimensions with bars that fill on load
   - Right panel: theme ranker leaderboard with bars that fill staggered
   - Center divider explains the agents' scoring chain in plain English
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Agentic Edge — how the agents score: chokepoint fit, technical setup, fundamentals, options flow, bull/bear conviction, risk panel verdict, plus a ranked leaderboard">
  <defs>
    <linearGradient id="sc-rack" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#11141b"/>
      <stop offset="100%" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="sc-brand" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="sc-good" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="sc-mid" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="sc-weak" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
  </defs>

  <!-- Page background -->
  <rect width="1400" height="900" fill="#0b0d12"/>

  <!-- ================= HEADER ================= -->
  <g transform="translate(40, 32)">
    <text font-size="11" font-weight="600" fill="#6c7388" letter-spacing="1.4">SCORECARD</text>
    <text y="28" font-size="26" font-weight="600" fill="#e7eaf2">How the agents score</text>
    <text y="50" font-size="12" fill="#98a0b3">Six dimensions per ticker. Composite is the weighted sum, surfaced on the leaderboard.</text>
    <text y="68" font-size="12" fill="#98a0b3">A name only ranks if it sits inside an active chokepoint theme — names that aren't critical to the supply chain don't appear at all.</text>
  </g>

  <!-- ================= LEFT PANEL: per-ticker scorecard ================= -->
  <g transform="translate(40, 130)">
    <rect width="640" height="730" rx="14" fill="url(#sc-rack)" stroke="#232a3a"/>

    <!-- Ticker header -->
    <g transform="translate(24, 24)">
      <rect width="120" height="44" rx="8" fill="#1a1f2b" stroke="#232a3a"/>
      <text x="14" y="20" font-size="10" font-weight="600" fill="#6c7388" letter-spacing="1.2">EXAMPLE</text>
      <text x="14" y="36" font-size="14" font-weight="600" fill="#6ee7b7">MU</text>
      <text x="160" y="22" font-size="14" font-weight="600" fill="#e7eaf2">Micron Technology</text>
      <text x="160" y="40" font-size="11" fill="#98a0b3">Theme: Advanced Memory · HBM3e capacity</text>
    </g>

    <!-- Composite + verdict -->
    <g transform="translate(440, 24)">
      <rect width="172" height="44" rx="8" fill="#0b0d12" stroke="#34d399"/>
      <text x="14" y="20" font-size="10" font-weight="600" fill="#6c7388" letter-spacing="1.2">COMPOSITE</text>
      <text x="14" y="38" font-size="16" font-weight="600" fill="#34d399">8.7 / 10  ·  BUY</text>
    </g>

    <!-- Section: scoring rows -->
    <g transform="translate(24, 96)">
      <text font-size="10" font-weight="600" fill="#6c7388" letter-spacing="1.2">SCORING DIMENSIONS</text>
    </g>

    <!-- Row 1: Profit Generation -->
    <g transform="translate(24, 124)">
      <text font-size="13" font-weight="500" fill="#e7eaf2">Profit Generation</text>
      <rect x="420" y="-12" width="170" height="14" rx="7" fill="#1a1f2b"/>
      <rect x="420" y="-12" width="0" height="14" rx="7" fill="url(#sc-good)">
        <animate attributeName="width" from="0" to="144" dur="1.4s" begin="0.0s" fill="freeze"/>
      </rect>
      <text x="599" y="-1" text-anchor="end" font-size="11" font-weight="600" fill="#0b0d12" font-family="ui-monospace,monospace">8.5
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.2s" fill="freeze"/>
      </text>
      <text y="14" font-size="10" fill="#98a0b3">GAAP-positive after the cycle bottom · gross margin 38% and expanding.</text>
    </g>

    <!-- Row 2: Revenue Growth -->
    <g transform="translate(24, 178)">
      <text font-size="13" font-weight="500" fill="#e7eaf2">Revenue Growth</text>
      <rect x="420" y="-12" width="170" height="14" rx="7" fill="#1a1f2b"/>
      <rect x="420" y="-12" width="0" height="14" rx="7" fill="url(#sc-good)">
        <animate attributeName="width" from="0" to="160" dur="1.4s" begin="0.15s" fill="freeze"/>
      </rect>
      <text x="599" y="-1" text-anchor="end" font-size="11" font-weight="600" fill="#0b0d12" font-family="ui-monospace,monospace">9.4
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.4s" fill="freeze"/>
      </text>
      <text y="14" font-size="10" fill="#98a0b3">Revenue +84% YoY · driven by HBM3e ramp · guidance raised twice.</text>
    </g>

    <!-- Row 3: Capital Efficiency -->
    <g transform="translate(24, 232)">
      <text font-size="13" font-weight="500" fill="#e7eaf2">Capital Efficiency</text>
      <rect x="420" y="-12" width="170" height="14" rx="7" fill="#1a1f2b"/>
      <rect x="420" y="-12" width="0" height="14" rx="7" fill="url(#sc-good)">
        <animate attributeName="width" from="0" to="136" dur="1.4s" begin="0.3s" fill="freeze"/>
      </rect>
      <text x="599" y="-1" text-anchor="end" font-size="11" font-weight="600" fill="#0b0d12" font-family="ui-monospace,monospace">8.0
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.6s" fill="freeze"/>
      </text>
      <text y="14" font-size="10" fill="#98a0b3">ROIC 14% and climbing · capex elevated for HBM expansion (justified).</text>
    </g>

    <!-- Row 4: Free Cash Flow Production -->
    <g transform="translate(24, 286)">
      <text font-size="13" font-weight="500" fill="#e7eaf2">Free Cash Flow Production</text>
      <rect x="420" y="-12" width="170" height="14" rx="7" fill="#1a1f2b"/>
      <rect x="420" y="-12" width="0" height="14" rx="7" fill="url(#sc-mid)">
        <animate attributeName="width" from="0" to="129" dur="1.4s" begin="0.45s" fill="freeze"/>
      </rect>
      <text x="599" y="-1" text-anchor="end" font-size="11" font-weight="600" fill="#0b0d12" font-family="ui-monospace,monospace">7.6
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.8s" fill="freeze"/>
      </text>
      <text y="14" font-size="10" fill="#98a0b3">Turned positive in Q3 · investing through the up-cycle (correct posture).</text>
    </g>

    <!-- Row 5: Balance Sheet Health -->
    <g transform="translate(24, 340)">
      <text font-size="13" font-weight="500" fill="#e7eaf2">Balance Sheet Health</text>
      <rect x="420" y="-12" width="170" height="14" rx="7" fill="#1a1f2b"/>
      <rect x="420" y="-12" width="0" height="14" rx="7" fill="url(#sc-good)">
        <animate attributeName="width" from="0" to="148" dur="1.4s" begin="0.6s" fill="freeze"/>
      </rect>
      <text x="599" y="-1" text-anchor="end" font-size="11" font-weight="600" fill="#0b0d12" font-family="ui-monospace,monospace">8.7
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.0s" fill="freeze"/>
      </text>
      <text y="14" font-size="10" fill="#98a0b3">Net cash position · debt/EBITDA &lt;1× · strong liquidity buffer.</text>
    </g>

    <!-- Row 6: Future Outlook -->
    <g transform="translate(24, 394)">
      <text font-size="13" font-weight="500" fill="#e7eaf2">Future Outlook</text>
      <rect x="420" y="-12" width="170" height="14" rx="7" fill="#1a1f2b"/>
      <rect x="420" y="-12" width="0" height="14" rx="7" fill="url(#sc-good)">
        <animate attributeName="width" from="0" to="163" dur="1.4s" begin="0.75s" fill="freeze"/>
      </rect>
      <text x="599" y="-1" text-anchor="end" font-size="11" font-weight="600" fill="#0b0d12" font-family="ui-monospace,monospace">9.6
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.2s" fill="freeze"/>
      </text>
      <text y="14" font-size="10" fill="#98a0b3">HBM3e supply tight through 2026 · structural demand · pricing power.</text>
    </g>

    <!-- Decision summary -->
    <g transform="translate(24, 460)">
      <line x1="0" y1="0" x2="592" y2="0" stroke="#1a1f2b"/>
      <text y="22" font-size="10" font-weight="600" fill="#6c7388" letter-spacing="1.2">DECISION CHAIN</text>
      <g transform="translate(0, 36)" font-size="11" fill="#cbd5e1">
        <text>Three gates first — a name only gets scored if all three clear:</text>
        <text y="20">  1. The theme is still in contact (HBM cycle confirmed; hyperscaler capex up).</text>
        <text y="40">  2. The chokepoint exists (HBM3e capacity is the gating constraint).</text>
        <text y="60">  3. MU is a critical link in the supply chain (≈45% leading-edge share).</text>
        <text y="84">Then score the six fundamental dimensions above · composite 8.7 / 10 · BUY.</text>
        <text y="104">Trader sizes to 7% NAV via PMCC if liquidity allows; else long equity.</text>
      </g>
    </g>

    <!-- Bottom note: critical "negative income but chokepoint" exception -->
    <g transform="translate(24, 678)" font-size="10" fill="#6c7388">
      <text>Future Outlook carries extra weight by design. A name with negative current income but a confirmed</text>
      <text y="14">chokepoint position and amazing revenue growth can still earn a Buy — the framework values structural</text>
      <text y="28">inevitability over a clean income statement. Score weights are configurable per theme.</text>
    </g>
  </g>

  <!-- ================= RIGHT PANEL: theme ranker leaderboard ================= -->
  <g transform="translate(720, 130)">
    <rect width="640" height="730" rx="14" fill="url(#sc-rack)" stroke="#232a3a"/>
    <text x="24" y="48" font-size="10" font-weight="600" fill="#6c7388" letter-spacing="1.2">THEME RANKER · BEST POSITIONED TO WIN</text>
