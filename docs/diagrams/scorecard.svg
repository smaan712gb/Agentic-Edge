        <text font-size="14" font-weight="600" fill="#34d399">2</text>
        <text x="64" font-size="14" font-weight="600" fill="#e7eaf2">NVDA</text>
        <text x="220" font-size="11" fill="#cbd5e1" font-family="-apple-system,sans-serif">AI Infrastructure</text>
        <rect x="380" y="-12" width="160" height="14" rx="7" fill="#1a1f2b"/>
        <rect x="380" y="-12" width="0" height="14" rx="7" fill="url(#sc-good)">
          <animate attributeName="width" from="0" to="134" dur="1.4s" begin="0.15s" fill="freeze"/>
        </rect>
        <text x="600" font-size="13" font-weight="600" fill="#34d399">8.4</text>
      </g>
